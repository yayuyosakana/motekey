name: Bootstrap Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap.yml"
      - "Config/**"
      - "HostApp/**"
      - "KeyboardExtension/**"
      - "Shared/**"
      - "Tests/**"
      - "Makefile"
      - "Package.swift"
      - "scripts/bootstrap_check.sh"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/bootstrap.yml"
      - "Config/**"
      - "HostApp/**"
      - "KeyboardExtension/**"
      - "Shared/**"
      - "Tests/**"
      - "Makefile"
      - "Package.swift"
      - "scripts/bootstrap_check.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Run bootstrap checks
        run: make bootstrap-check
